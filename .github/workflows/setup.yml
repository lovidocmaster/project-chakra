name: Chakra Supabase Setup

on:
  workflow_dispatch:
    inputs:
      run_setup:
        description: 'Run Supabase setup + warm start'
        required: false
        default: 'true'
  push:
    paths:
      - 'chakra_warm_start.py'

jobs:
  setup-and-warmstart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests python-dotenv

      - name: Run Supabase setup and warm start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 chakra_warm_start.py

      - name: Send Telegram notification
        run: |
          MSG="✅ CHAKRA SETUP DONE%0ASupabase ready%0A150 trades seeded%0ASelf-learning ACTIVE"
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"             -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || true
