name: Chakra Trading System CI/CD

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  notify-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Notify Telegram on code push
        run: |
          MSG="🚀 CHAKRA DEPLOYED%0A━━━━━━━━━━━━━━━━%0A📝 ${{ github.event.head_commit.message }}%0A✅ Render auto-redeploying...%0A🔗 github.com/lovidocmaster/project-chakra"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML" || true

  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check Render worker health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://project-chakra-production.up.railway.app/health \
            --max-time 10 || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            MSG="⚠️ CHAKRA HEALTH CHECK ALERT%0A━━━━━━━━━━━━━━━━%0AStatus: ${STATUS}%0ATime: $(date -u)%0A%0AAction needed:%0A1. Check dashboard.render.com%0A2. Click Manual Deploy if needed"
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=${MSG}" || true
          else
            echo "System healthy ✅"
          fi
