name: Trade Signals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv anthropic oanda-v20
    
    - name: Run quick trading signal
      env:
        ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
        OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        OANDA_ACCOUNT: ${{ secrets.OANDA_ACCOUNT }}
        OANDA_URL: ${{ secrets.OANDA_URL }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      run: python v10_complete.py --quick