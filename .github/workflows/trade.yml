name: Trade Signals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv oandapyV20 numpy pandas yfinance flask supabase

    - name: Run V14 Army trading cycle
      env:
        OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
        OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        FRED_KEY: ${{ secrets.FRED_KEY }}
        NEWS_KEY: ${{ secrets.NEWS_KEY }}
      run: python v14_army.py --once

    - name: Save learned state back to repo
      run: |
        git config user.name  "ProjectChakra-Bot"
        git config user.email "bot@projectchakra.ai"
        git add v13_memory.json v13_rl.json v13_weights.json v14_memory.json v14_rl.json v14_weights.json || true
        git diff --staged --quiet || git commit -m "Update trading state [skip ci]"
        git push || true