name: Project Chakra Trading

on:
  schedule:
    - cron: '*/30 7-17 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install libraries
        run: |
          pip install requests numpy pandas yfinance
          
      - name: Run trading system
        run: python v9_precision.py
        timeout-minutes: 25