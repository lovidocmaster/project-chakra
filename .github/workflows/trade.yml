name: Chakra Trading System CI/CD

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      run_setup:
        description: 'Run Supabase setup + warm start'
        required: false
        default: 'false'

jobs:
  notify-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Notify Telegram on code push
        run: |
          MSG="🚀 CHAKRA DEPLOYED%0A━━━━━━━━━━━━━━━━%0A📝 ${{ github.event.head_commit.message }}%0A✅ Render auto-redeploying...%0A🔗 github.com/lovidocmaster/project-chakra"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"             -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=HTML" || true

  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Check Render trading bot health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10             "https://project-chakra-production.up.railway.app/health" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            MSG="✅ CHAKRA HEALTH OK%0AStatus: 200 | $(date -u +'%H:%M UTC')"
          else
            MSG="⚠️ CHAKRA HEALTH CHECK%0AStatus: $STATUS | $(date -u +'%H:%M UTC')%0ACheck Render dashboard"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"             -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || true

  setup-supabase:
    runs-on: ubuntu-latest
    if: github.event.inputs.run_setup == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Create Supabase tables and warm start learning
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, requests
          from datetime import datetime, timedelta
          import random

          SUPA_URL = os.environ.get("SUPABASE_URL","")
          SUPA_KEY = os.environ.get("SUPABASE_KEY", os.environ.get("SUPABASE_ANON_KEY",""))

          if not SUPA_URL or not SUPA_KEY:
              print("❌ Supabase credentials not set in GitHub Secrets")
              print("   Add SUPABASE_URL and SUPABASE_ANON_KEY to repository secrets")
              exit(0)

          print(f"Connecting to Supabase: {SUPA_URL[:40]}...")
          headers = {"apikey": SUPA_KEY, "Authorization": f"Bearer {SUPA_KEY}",
                    "Content-Type": "application/json"}

          # Test connection
          resp = requests.get(f"{SUPA_URL}/rest/v1/system_state?limit=1", headers=headers, timeout=10)
          print(f"Connection test: {resp.status_code}")

          if resp.status_code == 200:
              print("✅ system_state table EXISTS")
          elif resp.status_code in (404, 406, 400):
              print("Tables missing — creating via REST upsert...")
              # Supabase creates table on first insert if using special header
              # We use the upsert to bootstrap
              r = requests.post(f"{SUPA_URL}/rest/v1/system_state",
                  json={"key": "init", "value": '{"initialized": true}',
                        "updated_at": datetime.utcnow().isoformat()},
                  headers={**headers, "Prefer": "resolution=merge-duplicates"},
                  timeout=10)
              print(f"Bootstrap: {r.status_code} {r.text[:100]}")
          else:
              print(f"Status {resp.status_code}: {resp.text[:100]}")

          # Generate synthetic warm-start trades
          print("
Generating warm-start data...")
          PATTERNS = [
              ("EUR_USD","TRENDING","LONDON",0.64),("GBP_USD","TRENDING","LONDON",0.62),
              ("AUD_USD","RANGING","NEW_YORK",0.57),("EUR_JPY","TRENDING","OVERLAP",0.61),
              ("NZD_USD","TRENDING","LONDON",0.60),("USD_CHF","RANGING","LONDON",0.58),
              ("USD_CAD","TRENDING","NEW_YORK",0.59),("GBP_JPY","TRENDING","LONDON",0.60),
          ]

          trades = []
          base = datetime.utcnow() - timedelta(days=90)
          TOP_AGENTS = ["SMC_ORDERBLOCK","BOS","ORDERFLOW","CHOCH","FVG","KILLZONE"]

          for i in range(150):
              p,reg,sess,wr = random.choice(PATTERNS)
              won = random.random() < wr
              trades.append({
                  "pair": p, "direction": random.choice(["BUY","SELL"]),
                  "confidence": round(random.uniform(0.60,0.78),3),
                  "regime": reg, "session": sess,
                  "outcome": "WIN" if won else "LOSS",
                  "pnl": round(random.uniform(80,400) if won else random.uniform(-220,-60),2),
                  "agents_agreed": random.sample(TOP_AGENTS,k=3),
                  "opened_at": (base + timedelta(days=i*90/150)).isoformat(),
              })

          wins = sum(1 for t in trades if t["outcome"]=="WIN")
          print(f"Trades: {len(trades)} | WR: {wins/len(trades)*100:.1f}%")

          # Compute agent weights
          weights = {a: 1.0 for a in TOP_AGENTS + ["RSI","STOCHASTIC","ATR","BOLLINGER"]}
          for t in trades:
              won = t["outcome"]=="WIN"
              for a in t.get("agents_agreed",[]):
                  if a in weights:
                      weights[a] = min(3.0, weights[a]*1.05) if won else max(0.1, weights[a]*0.95)

          # Compute FinMem
          pair_perf = {}
          for t in trades:
              p = pair_perf.setdefault(t["pair"],{"wins":0,"losses":0,"pnl":0.0})
              if t["outcome"]=="WIN": p["wins"]+=1
              else: p["losses"]+=1
              p["pnl"]+=t["pnl"]

          # Save to Supabase
          saves = [
              ("agent_weights", {"weights":weights,"updated":datetime.utcnow().isoformat()}),
              ("finmem", {"total":len(trades),"wins":wins,"losses":len(trades)-wins,
                         "pair_perf":pair_perf,"trades":trades[-100:],
                         "lessons":["Warm-start: 150 synthetic trades from backtest patterns"]}),
              ("rl_agent", {"q":{},"eps":0.25,"episodes":150,"reward_total":wins-len(trades)+wins}),
          ]

          for key, value in saves:
              r = requests.post(f"{SUPA_URL}/rest/v1/system_state",
                  json={"key": key, "value": json.dumps(value),
                        "updated_at": datetime.utcnow().isoformat()},
                  headers={**headers, "Prefer": "resolution=merge-duplicates"},
                  timeout=10)
              status = "✅" if r.status_code in (200,201) else "❌"
              print(f"  {status} {key}: {r.status_code}")

          print("
✅ Supabase setup + warm start complete!")
          print(f"   System has {len(trades)} trades of experience")
          print(f"   Self-learning, HiveMind, RL all activated")
          PYEOF

      - name: Notify completion
        run: |
          MSG="✅ CHAKRA SETUP COMPLETE%0A━━━━━━━━━━━━━━━━%0ASupabase tables created%0AWarmed with 150 synthetic trades%0ASelf-learning ACTIVE%0ARL Memory ACTIVE%0AHiveMind ACTIVE"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"             -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || true
